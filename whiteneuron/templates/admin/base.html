{% extends "admin/base.html" %}
{% load i18n static unfold wn_notifications %}


{% block base %}
    <!-- Overlay loading -->
    <div id="loading-overlay" role="status" aria-live="polite">
        <span class="ui-loading ui-loading-spinner ui-loading-lg text-white" aria-label="{% trans 'Loading' %}"></span>
    </div>

    <!-- toast -->
    {% notifications_websocket as ws_enabled %}
    {% notifications_unread_url as unread_url %}
    {% notifications_poll_seconds as poll_seconds %}
    <div class="ui-toast ui-toast-top ui-toast-end z-50" id="toast-container" aria-live="polite" data-wn-toast-title="{% translate 'Notification' %}" data-wn-toast-dismiss="{% translate 'Click to dismiss' %}"{% if request.user.is_authenticated %}{% if ws_enabled %} data-wn-ws="1"{% endif %}{% if unread_url %} data-wn-unread-url="{{ unread_url }}" data-wn-unread-poll="{{ poll_seconds }}"{% endif %}{% endif %}>
    </div>
    {{ block.super }}
{% endblock %}
