{% load i18n unfold %}

{% if guest_login_available %}
<form method="post" action="{% url 'guest_login' %}" class="mt-3">
    {% csrf_token %}
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    {% component "unfold/components/button.html" with submit=1 variant="secondary" class="w-full" %}
        {% translate "Log in as guest" %} <span class="material-symbols-outlined text-sm">person</span>
    {% endcomponent %}
</form>
{% endif %}
