{% load i18n static %}
{# AI assistant: header button + slide-in panel. Included by unfold/helpers/userlinks.html #}
<link rel="stylesheet" href="{% static 'chatbot/chatbot.css' %}">
<button type="button" id="wn-chatbot-toggle" aria-controls="wn-chatbot-panel" aria-expanded="false"
        class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium cursor-pointer bg-primary-600 text-white hover:bg-primary-600/80 transition-colors">
    <span class="material-symbols-outlined shrink-0" style="font-size:0.95rem;line-height:1" aria-hidden="true">smart_toy</span>
    <span class="max-xl:hidden whitespace-nowrap">{% translate "AI Assistant" %}</span>
</button>

<aside id="wn-chatbot-panel" class="wn-chatbot-panel" hidden
       role="dialog" aria-labelledby="wn-chatbot-title"
       data-url="{{ chatbot_url }}" data-csrf="{{ csrf_token }}"
       data-thinking="{% translate 'Thinking…' %}" data-connection-error="{% translate 'Connection error. Please try again.' %}">
    <div class="flex items-center justify-between px-4 py-3 border-b border-base-200 dark:border-base-700">
        <h2 id="wn-chatbot-title" class="flex items-center gap-2 font-semibold text-font-important-light dark:text-font-important-dark">
            <span class="material-symbols-outlined text-primary-600" aria-hidden="true">smart_toy</span>
            {% translate "AI Assistant" %}
        </h2>
        <button type="button" data-chatbot-close class="flex items-center p-1 rounded-default cursor-pointer hover:bg-base-100 dark:hover:bg-base-800" title="{% translate 'Close' %}">
            <span class="material-symbols-outlined" aria-hidden="true">close</span>
        </button>
    </div>

    <div class="wn-chatbot-messages" aria-live="polite">
        <div class="wn-chatbot-msg wn-chatbot-msg-bot">{% translate "Hello! I am your AI assistant. How can I help you today?" %}</div>
    </div>

    <form class="flex items-end gap-2 p-3 border-t border-base-200 dark:border-base-700">
        <textarea name="message" rows="2" maxlength="4000" required
                  placeholder="{% translate 'Type your question…' %}"
                  class="wn-chatbot-input grow resize-none rounded-default border border-base-200 bg-white px-3 py-2 text-sm dark:border-base-700 dark:bg-base-900"></textarea>
        <button type="submit" class="flex items-center justify-center h-10 w-10 shrink-0 rounded-default cursor-pointer bg-primary-600 text-white hover:bg-primary-600/80 disabled:opacity-50" title="{% translate 'Send' %}">
            <span class="material-symbols-outlined" aria-hidden="true">send</span>
        </button>
    </form>
</aside>
<script src="{% static 'chatbot/chatbot.js' %}" defer></script>
