{% load i18n static %}
{# AI assistant: header button + slide-in panel. Included by unfold/helpers/userlinks.html #}
<link rel="stylesheet" href="{% static 'chatbot/chatbot.css' %}">
<button type="button" id="wn-chatbot-toggle" class="wn-chatbot-toggle" aria-controls="wn-chatbot-panel" aria-expanded="false" title="{% translate 'AI Assistant' %}">
    <span class="material-symbols-outlined" aria-hidden="true">smart_toy</span>
    <span class="wn-chatbot-toggle-label">{% translate "AI Assistant" %}</span>
</button>

<div class="wn-chatbot-backdrop" data-chatbot-close hidden></div>
<aside id="wn-chatbot-panel" class="wn-chatbot-panel" hidden
       role="dialog" aria-modal="false" aria-labelledby="wn-chatbot-title"
       data-url="{{ chatbot_url }}" data-csrf="{{ csrf_token }}"
       data-thinking="{% translate 'Thinking…' %}" data-connection-error="{% translate 'Connection error. Please try again.' %}">
    <header class="wn-chatbot-header">
        <span class="wn-chatbot-avatar wn-chatbot-avatar-lg" aria-hidden="true"><span class="material-symbols-outlined">smart_toy</span></span>
        <div class="wn-chatbot-heading">
            <h2 id="wn-chatbot-title">{% translate "AI Assistant" %}</h2>
            <p>{% translate "AI can make mistakes." %}</p>
        </div>
        <button type="button" class="wn-chatbot-icon-btn" data-chatbot-reset title="{% translate 'New conversation' %}">
            <span class="material-symbols-outlined" aria-hidden="true">edit_square</span>
        </button>
        <button type="button" class="wn-chatbot-icon-btn" data-chatbot-close title="{% translate 'Close' %}">
            <span class="material-symbols-outlined" aria-hidden="true">close</span>
        </button>
    </header>

    <div class="wn-chatbot-messages" aria-live="polite">
        <template data-chatbot-greeting>
            <div class="wn-chatbot-row wn-chatbot-row-bot">
                <span class="wn-chatbot-avatar" aria-hidden="true"><span class="material-symbols-outlined">smart_toy</span></span>
                <div class="wn-chatbot-msg wn-chatbot-msg-bot">{% translate "Hello! I am your AI assistant. How can I help you today?" %}</div>
            </div>
        </template>
    </div>

    <form class="wn-chatbot-composer">
        <div class="wn-chatbot-input-box">
            <textarea name="message" rows="1" maxlength="4000" required
                      aria-label="{% translate 'Type your question…' %}"
                      placeholder="{% translate 'Type your question…' %}"></textarea>
            <button type="submit" class="wn-chatbot-send" disabled title="{% translate 'Send' %}">
                <span class="material-symbols-outlined" aria-hidden="true">arrow_upward</span>
            </button>
        </div>
        <p class="wn-chatbot-hint">{% translate "Enter to send, Shift+Enter for a new line" %}</p>
    </form>
</aside>
<script src="{% static 'chatbot/chatbot.js' %}" defer></script>
